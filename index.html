    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #f3f4f6; }
        
        /* Efeito 3D de profundidade e movimento contínuo no fundo */
        @keyframes float3D {
            0% { transform: scale(1) translate(0px, 0px) rotate(0deg); }
            33% { transform: scale(1.08) translate(-15px, -10px) rotate(1deg); }
            66% { transform: scale(1.12) translate(15px, 10px) rotate(-1deg); }
            100% { transform: scale(1) translate(0px, 0px) rotate(0deg); }
        }

        .bg-3d-motion {
            background: linear-gradient(rgba(10, 10, 10, 0.75), rgba(10, 10, 10, 0.85)), 
                        url('https://images.unsplash.com/photo-1601506521937-0121a7fc2a6b?q=80&w=2071&auto=format&fit=crop') no-repeat center center/cover;
            animation: float3D 25s infinite ease-in-out;
            will-change: transform;
        }

        /* Carrossel Infinito Fluido e Contínuo (Sem Paragens) */
        .marquee-section {
            background: #0a0a0a;
            overflow: hidden;
            width: 100%;
            padding: 2.5rem 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }

        .marquee-section::before,
        .marquee-section::after {
            content: '';
            position: absolute;
            top: 0;
            width: 100px;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .marquee-section::before {
            left: 0;
            background: linear-gradient(to right, #0a0a0a, transparent);
        }

        .marquee-section::after {
            right: 0;
            background: linear-gradient(to left, #0a0a0a, transparent);
        }
