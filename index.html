<!-- SCRIPT DE LIGAÇÃO AO SUPABASE -->
<script>
    const supabaseUrl = 'https://qeykaxyclbknshzhykyo.supabase.co';
    const supabaseKey = 'sb_publishable_U9rAFsAiHONYvWFIbzftsQ_mB1LeBv8';
    
    // Inicializa o Supabase com as tuas chaves usando a variável global window.supabase
    const dbClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    async function carregarDados() {
        try {
            const { data, error } = await dbClient.from('mensagens').select('*');
            const lista = document.getElementById('lista-mensagens');
            
            lista.innerHTML = ''; 

            if (error) {
                throw error;
            }

            if (data && data.length > 0) {
               data.forEach(msg => {
                  const item = document.createElement('li');
                  item.textContent = "✓ " + msg.texto;
                  lista.appendChild(item);
              });
            } else {
               lista.innerHTML = '<li>A base de dados está ligada, mas a tabela mensagens está vazia.</li>';
            }

        } catch (erro) {
            const lista = document.getElementById('lista-mensagens');
            lista.innerHTML = `<li class="text-red-500">Erro: Não foi possível ligar à base de dados.</li>`;
            console.error("Erro Supabase:", erro.message);
        }
    }

    carregarDados();
</script>
